general {
    lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# This is for sleep and screen dimming, remove if not needed
listener {
    timeout = 60
    on-timeout = hyprctl dispatch "hl.dsp.dpms(on)"
    on-resume = hyprctl dispatch "hl.dsp.dpms(off)"
}

listener {
    timeout = 900
    on-timeout = loginctl suspend
}
